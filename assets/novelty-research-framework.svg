<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc"><title id="title">Environmental novelty and sustained attention research framework</title><desc id="desc">A proposed framework linking spatial environment updates, perceived novelty, sustained attention and adaptive design through repeated exposure and multimodal assessment.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#84988b"/></marker></defs><rect width="1000" height="640" fill="#f5f7f2"/><g font-family="Arial,Helvetica,sans-serif" fill="#253f33"><text x="48" y="52" font-size="27">Adaptive visual environments</text><text x="48" y="82" font-size="13" fill="#66776b">POLAR HABITATION · PROPOSED RESEARCH</text><rect x="48" y="110" width="904" height="53" rx="4" fill="#e1e9de"/><text x="500" y="143" font-size="20" text-anchor="middle">How can environmental change support attention over time?</text><rect x="48" y="205" width="286" height="130" rx="4" fill="#fff" stroke="#cbd7cc"/><text x="68" y="234" font-size="12" fill="#84988b">01</text><text x="68" y="264" font-size="23">Spatial updates</text><text x="68" y="294" font-size="14" fill="#66776b">Positions · spacing · clustering</text><text x="68" y="316" font-size="13" fill="#66776b">Controlled natural visual scenes</text><rect x="357" y="205" width="286" height="130" rx="4" fill="#fff" stroke="#cbd7cc"/><text x="377" y="234" font-size="12" fill="#84988b">02</text><text x="377" y="264" font-size="23">Perceived novelty</text><text x="377" y="294" font-size="14" fill="#66776b">Novelty and familiarity ratings</text><text x="377" y="316" font-size="13" fill="#66776b">Change during repeated exposure</text><rect x="666" y="205" width="286" height="130" rx="4" fill="#fff" stroke="#cbd7cc"/><text x="686" y="234" font-size="12" fill="#84988b">03</text><text x="686" y="264" font-size="23">Sustained attention</text><text x="686" y="294" font-size="14" fill="#66776b">Behavioural task performance</text><text x="686" y="316" font-size="13" fill="#66776b">Multimodal human responses</text><path d="M337 270h15" stroke="#84988b" stroke-width="2" marker-end="url(#arrow)"/><path d="M646 270h15" stroke="#84988b" stroke-width="2" marker-end="url(#arrow)"/><path d="M86 365H914" stroke="#9aaf9f" stroke-width="2" marker-end="url(#arrow)"/><rect x="354" y="347" width="292" height="36" fill="#f5f7f2"/><text x="500" y="371" font-size="17" text-anchor="middle" fill="#66776b">Repeated exposure over time</text><rect x="48" y="406" width="432" height="110" rx="4" fill="#fff" stroke="#cbd7cc"/><text x="70" y="440" font-size="22">Immersive experiments</text><text x="70" y="470" font-size="15" fill="#66776b">CAVE visual environments</text><text x="70" y="495" font-size="14" fill="#66776b">Behaviour · EEG · eye tracking · physiology</text><rect x="520" y="406" width="432" height="110" rx="4" fill="#fff" stroke="#cbd7cc"/><text x="542" y="440" font-size="22">From evidence to design</text><text x="542" y="470" font-size="15" fill="#66776b">Model response patterns and ranges</text><text x="542" y="495" font-size="14" fill="#66776b">Inform update magnitude and timing</text><rect x="48" y="550" width="904" height="61" rx="4" fill="#294e3f"/><text x="500" y="578" font-size="21" text-anchor="middle" fill="white">Adaptive environments for attention and wellbeing</text><text x="500" y="600" font-size="13" text-anchor="middle" fill="#dce8da">Research aims and proposed pathway</text></g></svg>